  <text x="55.0" y="92.0" font-size="20" fill="#677D74" text-anchor="start">视频仅作补充；课堂互动继续保留。公开查询不携带个人对话、附件正文或私密经历。</text>
  <text x="55.0" y="151.0" font-size="21" fill="#356753" text-anchor="start">01  有限预算下的可核验推荐</text>
  <text x="1010.0" y="550.0" font-size="18" fill="#536653" text-anchor="middle">C 当前目标覆盖   R 语义相关   M 互补用途   P 显式偏好   D 同用途重复</text>
  <text x="1010.0" y="582.0" font-size="18" fill="#536653" text-anchor="middle">J = 0.40C + 0.30R + 0.20M + 0.10P − 0.20D；无偏好时停用 P 并重归一正向权重</text>
  <text x="55.0" y="645.0" font-size="21" fill="#8C7546" text-anchor="start">02  以学生自主表达为起点的可选流程（全程可跳过）</text>
  <text x="800.0" y="842.0" font-size="19" fill="#677D74" text-anchor="middle">来源与结论分开：未知不记错题；点击视频不计完成；不能用没有取得的字幕核对整段视频。</text>
  <text x="190.0" y="892.0" font-size="20" fill="#677D74" text-anchor="start">03  工程评测（不进入学生每次打开课程的实时路径）</text>
