<text x="60" y="820.0" font-size="12" fill="#111827">HIERARCHY 归属边（12 条）—— 画像类记忆直接挂根节点</text>
<line x1="32.0" y1="836.0" x2="52.0" y2="836.0" stroke="#2a78d6" stroke-width="2" stroke-dasharray="3 3" opacity="0.7"/>
<text x="60" y="840.0" font-size="12" fill="#111827">SIMILARITY 语义边（5 条）—— 余弦相似度 ≥ 0.7</text>
<text x="32" y="866.0" font-size="11.5" fill="#6B7280">环半径 = 分代（OLD 120px → SURVIVOR 200 → NEW 280 → PENDING_GC 320）；节点大小 = 10 × (1 + ln(1+访问次数) × 重要度/10)，绘制时 clamp 到 6~30</text>
<text x="32" y="886.0" font-size="11.5" fill="#6B7280">EPISODIC 不在"画像类"里；它靠 SIMILARITY 边关联，<tspan font-weight="600">一条边都没有时补一条归属边</tspan>，避免孤立点</text>
<text x="32" y="906.0" font-size="11.5" fill="#6B7280">PENDING_GC 表示下次衰减（每日 03:00）就会被删除：重要度 &lt; 2，或情景记忆超过 60 天</text>
<text x="32" y="926.0" font-size="11.5" fill="#6B7280">注：界面里只有半径 ≥ 12 的节点常驻显示标签（其余靠 hover）；本图为了静态可读全部标注，并已把标签移到节点外侧避让</text>
</svg>