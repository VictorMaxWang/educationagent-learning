# This file replaces the default configuration location; never import dev or local secrets.
spring.application.name=educationagent-isolated-test
spring.config.import=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=3000
spring.sql.init.mode=never
spring.data.redis.host=127.0.0.1
spring.data.redis.port=1
spring.data.redis.timeout=500ms
spring.data.redis.repositories.enabled=false
spring.mail.host=127.0.0.1
spring.mail.port=1
spring.mail.username=isolated-test
spring.mail.password=
spring.mail.test-connection=false
# Mail/Redis are mocked boundaries; their auto-configured health probes must not open sockets.
management.health.mail.enabled=false
management.health.redis.enabled=false
spring.ai.mcp.client.enabled=false

# Real DB connections are injected only after the initializer validates TEST_MYSQL_*.
# Real Redis is reserved for the explicitly enabled capacity benchmark.
bot.auto-start-count=0
wechat.bot.enable=false
wecom.robot.enabled=false
mcp.lazy.enabled=true
mcp.lazy.preload=
mcp.didi.enabled=false
mcp.didi.base-url=http://127.0.0.1:1
mcp.liepin.enabled=false
mcp.mcdonald.enabled=false
mcp.daolv.enabled=false
mcp.daolv-flight.enabled=false
mcp.antv-chart.enabled=false
mcp.wecom-doc.enabled=false
mcp.wecom-todo.enabled=false
mcp.xhs.enabled=false
juhe.mcp.enabled=false
maimemo.enabled=false
life.xhs.comment-watch.enabled=false
edu.demo.seed-enabled=false
edu.auth.demo-teacher.enabled=false
edu.auth.legacy-token-enabled=false

memory.chroma.enabled=false
memory.store.enabled=true
memory.store.dimension=1024
memory.decay.enabled=false
memory.working.enabled=false
memory.extractor.llm-enabled=false
memory.integration.enabled=false
router.enabled=true
router.mode=hybrid
router.rule.enabled=true
router.tfidf.enabled=true
router.tfidf.seed-path=classpath:router/intent-seeds.json
router.llm.enabled=false
router.eval.log-enabled=false
ai.fc.toolguard.judge.enabled=false
chat.context.max-rounds=20
classroom.code.enabled=false

# Offline placeholders satisfy binding; model/HTTP/mail beans are replaced by test mocks.
ai.chat.base-url=http://127.0.0.1:1/v1
ai.chat.api-key=${TEST_MODEL_PLACEHOLDER_KEY:}
ai.chat.model=isolated-test-model
ai.deepseek.url=http://127.0.0.1:1/chat/completions
ai.deepseek.key=
ai.aliyun.key=
weather.key=
weather.url=http://127.0.0.1:1
amap.key=
train.api.key=
file.convert.libreoffice.path=
file.convert.im.path=
