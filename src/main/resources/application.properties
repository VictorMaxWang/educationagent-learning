spring.application.name=demo
server.port=8888

spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

spring.profiles.active=dev
spring.config.import=optional:file:./config/local-secrets.properties

# Multipart 上传限制（宠物诊断图片等）
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# ILink Wechat Bot
wechat.bot.enable=true
wechat.bot.base-url=https://ilinkai.weixin.qq.com
wechat.bot.qr-show-type=console
wechat.bot.poll-wait=1000

# Multi Bot
bot.auto-start-count=0
bot.start-delay-ms=3000

# QWeather
# NOTE: the host is PER-ACCOUNT. It must belong to the same account as
# weather.key (in application-dev.properties), otherwise the API answers
# Changing the key without changing this host breaks weather lookup.
weather.url=${WEATHER_URL:${local.secrets.weather.url:}}

# DeepSeek LLM
ai.deepseek.url=https://api.deepseek.com/v1/chat/completions
ai.deepseek.model=deepseek-v4-pro
# 出行模块（行程/穿搭/拍照攻略）用快速非推理模型，直接读 content，避免推理模型超时/空回复
ai.deepseek.outfit-model=deepseek-chat

# Aliyun DashScope LLM
ai.aliyun.url=https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
ai.aliyun.model=qwen-vl-max
ai.aliyun.key=${AI_ALIYUN_KEY:${dashscope.api.key:}}

# Text Image Generate
ai.image.gen.url=https://dashscope.aliyuncs.com/api/v1/services/aigc/text2image/image-synthesis
ai.image.gen.model=wan2.5-t2i-preview
ai.image.gen.size=1024*1024
ai.image.gen.negative-prompt=low quality,blurry,deformed,distorted,watermark,text,signature,extra fingers,bad proportions,out of focus
ai.image.gen.key=${AI_IMAGE_GEN_KEY:${dashscope.api.key:}}

# Tencent ASR
tencent.asr.region=ap-guangzhou

# Tencent TTS
tencent.tts.voice-type=${TENCENT_TTS_VOICE_TYPE:403005}
tencent.tts.sample-rate=${TENCENT_TTS_SAMPLE_RATE:16000}
classroom.voice.teacher-voice-type=${CLASSROOM_VOICE_TEACHER_VOICE_TYPE:${tencent.tts.voice-type}}
classroom.voice.peer-voice-type=${CLASSROOM_VOICE_PEER_VOICE_TYPE:${tencent.tts.voice-type}}
tencent.tts.region=ap-guangzhou

# 网站实时朗读独立于腾讯微信/英语音色；课堂、成长问答和全局语音球默认 Cherry（芊悦）。
# 仅引用受保护配置或环境变量，不把密钥写入仓库。无凭证/ffmpeg 时明确降级为文字。
website.tts.provider=${WEBSITE_TTS_PROVIDER:maas-qwen-realtime}
website.tts.voice=${WEBSITE_TTS_VOICE:Cherry}
website.tts.aliyun.api-key=${DASHSCOPE_API_KEY:}
website.tts.aliyun.endpoint=${ALIYUN_TTS_ENDPOINT:https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation}
# 原 MaaS 与官方百炼凭据不能混用；网站默认复用同一 MaaS 的 AI_CHAT_API_KEY。
website.tts.maas.api-key=${AI_CHAT_API_KEY:}
website.tts.maas.endpoint=${MAAS_TTS_ENDPOINT:https://maas.qianwenaiapi.com/api/v1/services/aigc/multimodal-generation/generation}
website.tts.model=${WEBSITE_TTS_MODEL:qwen3-tts-flash}
website.tts.realtime.endpoint=${MAAS_TTS_REALTIME_ENDPOINT:wss://maas.qianwenaiapi.com/api-ws/v1/realtime}
website.tts.realtime.model=${WEBSITE_TTS_REALTIME_MODEL:qwen3-tts-flash-realtime}
website.tts.ffmpeg=${WEBSITE_TTS_FFMPEG:ffmpeg}

# Chat Context
chat.context.max-rounds=20
chat.context.data-dir=data/chat_context

# Chroma Vector
memory.chroma.enabled=true
memory.chroma.url=http://localhost:8001
# 单次 /add 请求最多提交多少条。1024 维向量按 JSON double 约 20KB/条，
# 500 条约 10MB —— 远低于 fastjson2 的 64MB 上限。别调大：整库一次提交
# （实测 3224 条 ≈ 64MB）必然失败，报 "Maximum array size exceeded"，
# 或让 Chroma 直接掐连接，结果是知识库永远入库失败、每分钟重试。
memory.chroma.add-batch-size=500

# Embedding provider: dashscope | siliconflow | ollama
# NOTE: switching provider may change the vector dimension. Chroma fixes a collection's
# dimension on first write and rejects others (HTTP 400), so collections must be rebuilt.
#   dashscope / siliconflow / ollama(bge-m3) all use 1024 dims -> no collection cleanup needed
#   nomic-embed-text (ollama only) is 768 dims -> user_memory_* must be dropped manually
memory.embedding.provider=siliconflow
memory.embedding.dimension=1024
# SiliconFlow (OpenAI-compatible; BAAI/bge-m3 is 1024 dims and matches the DashScope dim)
memory.embedding.siliconflow.key=${MEMORY_EMBEDDING_SILICONFLOW_KEY:${siliconflow.api.key:}}
memory.embedding.siliconflow.url=https://api.siliconflow.cn/v1/embeddings
memory.embedding.siliconflow.model=BAAI/bge-m3
# Ollama (fully local, offline)
memory.embedding.ollama.url=http://127.0.0.1:11434
memory.embedding.ollama.model=bge-m3
# DashScope model (only used when memory.embedding.provider=dashscope)
memory.embedding.model=text-embedding-v3

# RAG Eval
# NOTE: model must be a non-reasoning model. ai.deepseek.model (deepseek-v4-pro) is a
# reasoning model whose content comes back empty / times out, so the judge uses its own key.
rag.eval.model=deepseek-chat
rag.eval.judge-temperature=0
rag.eval.answer-temperature=0
rag.eval.default-collection=travel_knowledge
rag.eval.default-top-k=5
rag.eval.default-sample-size=20
rag.eval.default-days=1
rag.eval.default-time=03:00
rag.eval.parallelism=4
rag.eval.max-top-k=20

# Web Screenshot
screenshot.viewport.width=1280
screenshot.max.height=2000
screenshot.page.timeout=30

# scheduled.task.cron replaced by per-user ReportScheduleService
# scheduled.task.users replaced by per-user DB settings
# Spring
spring.task.scheduling.pool.size=3
spring.task.scheduling.thread-name-prefix=scheduled-task-
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=60s

# ==================== Pre-Router (L1 rules -> L2 TF-IDF -> L3 LLM) ====================
# All keys are optional; defaults live in com.demo.router.RouterProperties.
# NOTE: this file is read as ISO-8859-1, so keep values ASCII (Chinese keywords
# are hard-coded in Java sources on purpose).
router.enabled=true
# rule = L1 only; hybrid = L1 + L2 + L3
router.mode=hybrid
router.rule.enabled=true
router.tfidf.enabled=true
# Absolute similarity floor for adopting an intent
router.tfidf.threshold.high=0.25
# Below this => not recognised => FALLBACK (full tool set). See RouterProperties for why.
router.tfidf.threshold.low=0.12
# top1 - top2 dominance floor; measured 0.10 separates correct (>=0.133) from wrong (<=0.025)
router.tfidf.min-margin=0.10
# true = treat low similarity as CHAT (0 tools). Default false is the safe choice.
router.tfidf.chat-on-low-similarity=false
router.tfidf.seed-path=classpath:router/intent-seeds.json
router.tfidf.store-path=data/intent-tfidf.json
# L3 costs real tokens => off by default
router.llm.enabled=false
router.llm.model=deepseek-v4-flash
router.llm.temperature=0
router.llm.timeout-ms=3000
router.llm.circuit-breaker.enabled=true
router.llm.circuit-breaker.failure-threshold=5
router.llm.circuit-breaker.cooldown-seconds=60
# Tool narrowing: keep intent tools + common tools, instead of all 66
router.tool-filtering.enabled=true
router.tool-filtering.common-tools=searchWeb
router.tool-filtering.tokens-per-tool=60
router.tool-filtering.fallback-on-empty=true
router.eval.log-enabled=true
router.eval.log-path=logs/router-eval.jsonl
router.eval.recent-buffer-size=500

# ==================== ToolGuard (three-state audit) ====================
# mode=log records only; mode=enforce lets FAIL trigger a violation retry.
ai.fc.toolguard.enabled=true
ai.fc.toolguard.mode=log
# LLM judge only runs on AMBIGUOUS; off by default (costs tokens)
ai.fc.toolguard.judge.enabled=false
ai.fc.toolguard.judge.model=deepseek-v4-flash
ai.fc.toolguard.judge.temperature=0
ai.fc.toolguard.judge.max-tokens=100
ai.fc.toolguard.judge.timeout-ms=3000
ai.fc.toolguard.judge.circuit-breaker.enabled=true
ai.fc.toolguard.judge.circuit-breaker.failure-threshold=5
ai.fc.toolguard.judge.circuit-breaker.cooldown-seconds=60

# ==================== Law RAG (retrieval tightening + soft degradation) ====================
law.knowledge.top-k=3
# Tightened from 1.2: with 1.2 all three hits for "正当防卫怎么判" passed (0.4397/0.5096/0.5120)
law.knowledge.distance-threshold=0.85
# Relative cutoff: keep only distance <= top1 * this ratio
law.knowledge.relative-cutoff-ratio=1.08
# Drop near-empty articles (e.g. OCR artefacts like "1. 。")
law.knowledge.min-content-length=10
# When the requested library has no vectors, fall back to civil with an explicit notice
law.knowledge.fallback-to-civil=true
# Guarantee at least one article survives filtering
law.knowledge.keep-at-least-one=true
law.knowledge.max-round=5

# ==================== Local user-memory RAG (Lucene, no cloud embedding needed) ====================
# Chinese keyword lists (feedback/degradation) intentionally live in Java sources,
# because this file is read as ISO-8859-1.
memory.store.enabled=true
memory.store.index-path=data/memory-index
memory.store.analyzer=cjk
memory.store.max-memory-per-user=1000
# MUST match the embedding provider's dimension; changing it rebuilds the index
memory.store.dimension=1024
memory.extractor.rule-enabled=true
# LLM fallback extraction: off — extraction is rules-only, zero LLM cost.
# Coverage is bounded by the regex set in MemoryExtractor (see RULE_PATTERNS);
# widen that instead of flipping this on.
memory.extractor.llm-enabled=false
# 单轮最多抽几条事实。规则层一共 10 类，用户可能把好几件事塞进一条消息里说，
# 上限太低会把后半截直接丢掉（曾设 5，用户一次发 12 句就只进去了 5 条）
memory.extractor.max-facts=10
# 埋点式全量捕获：10 条规则都没命中时，把原句也存成一条记忆（重要度 2）。
# 这让"说什么都能加进去"成立 —— 但原句会被 memory.integration.min-importance
# 拦在提示词之外，所以脑图完整、上下文不被稀释。
memory.extractor.capture-all=true
# 短于此长度的消息不捕获，挡掉"嗯""好的""谢谢"这类纯应答
memory.extractor.capture-min-length=4
# 每条记忆抽几个关键词（本地无词典切分，零 token，只当脑图标签用）
memory.extractor.keywords-max=5
memory.rag.enabled=true
memory.rag.top-k=5
memory.rag.min-score=0.35
memory.rag.async-reinforce=true
memory.hybrid.enabled=true
memory.hybrid.memory-top-k=5
memory.hybrid.law-top-k=5
# Floor on the PRE-fusion original score, NOT on the RRF fused score.
# RRF fused scores are only ~0.005-0.016 (k=60), so a 0.6 floor there would
# discard everything and silently break hybrid retrieval. See RrfFusion javadoc.
memory.hybrid.min-score=0.0
memory.hybrid.memory-weight=0.3
memory.hybrid.law-weight=0.5
memory.hybrid.rrf-k=60
memory.hybrid.dedupe-threshold=0.95
memory.hybrid.timeout-seconds=30
memory.decay.enabled=true
memory.decay.cron=0 0 3 * * ?
memory.decay.batch-size=100
memory.decay.max-age-days=90
memory.decay.soft-decay-days=30
memory.decay.soft-decay-factor=0.9
# EPISODIC 单独一档，相当于 JVM 的"年轻人代回收更频繁"：
# 埋点捕获的原句和一次性事件没有长期价值，该比"用户叫张三"死得早，
# 否则脑图迟早被闲聊淹没。
# ⚠️ 60 必须与 MemoryGraphService.generation 的 PENDING_GC 阈值一致 ——
# 若删除线设得比 60 小，记忆会在图上变红之前就被删掉，"即将被回收"永远看不到。
memory.decay.episodic-max-age-days=60
memory.decay.episodic-soft-decay-days=14
memory.feedback.enabled=true
memory.feedback.implicit-enabled=true
memory.feedback.implicit-similarity-threshold=0.9
memory.working.enabled=true
memory.working.session-timeout-minutes=30
memory.working.check-interval-ms=300000
memory.graph.enabled=true
memory.graph.max-nodes=100
# 脑图只显示 accessCount >= 此值的记忆。新记忆写入时 accessCount=0，设成 1 会让
# "刚说过的" 完全不上图（要等它被检索命中一次才出现），看起来就像功能坏了。
# 想只看"被用过的"记忆就改回 1。
memory.graph.min-access-count=0
memory.graph.similarity-threshold=0.7
# 脑图在独立线程池里构建的最长等待时间；超时/异常都降级为"仅根节点"空图
memory.graph.timeout-seconds=5
# 构图结果的 TTL 缓存（秒）。脑图是 O(N²) 余弦计算，而前端每 15 秒轮询一次，
# 没有缓存的话记忆多的用户会周期性把 CPU 打满。设 0 关闭缓存。
memory.graph.cache-ttl-seconds=10

# 记忆脑图专用线程池（memory.graph.enabled=false 时不装配，服务退回同步构建）
thread.graph.core-size=1
thread.graph.max-size=2
thread.graph.queue-capacity=20
# Set to true to switch user memory from Chroma to the local Lucene store.
# See MemoryProperties.Integration javadoc for the trade-off.
#
# NOTE: while this is false the local Lucene store is NEVER written to, so the
# 运维观测 → 记忆脑图 page (GET /api/memory/graph) is always empty no matter how
# much you chat. Flipped to true so the mind map has data; set back to false to
# return to the Chroma UserMemory path (the two are either/or, not additive).
memory.integration.enabled=true
# 注入提示词的最低重要度。埋点捕获的原句=2、规则抽出的干净事实=5~9，
# 所以设 3 的效果是「原句只在脑图上可见，不进提示词」。
# 想让模型也记得你说过的每句话，改成 2 即可。
memory.integration.min-importance=3
memory.integration.retrieve-top-k=5
memory.integration.async-write=true

# ==================== Actuator / Micrometer ====================
# SECURITY: only health/info/prometheus/metrics are exposed.
# Do NOT add "env" or "configprops" here -- application-dev.properties still holds
# plaintext production secrets (DeepSeek key, DB root password, XHS cookie, ...)
# and those two endpoints would dump them in cleartext.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=agent-nexus
management.prometheus.metrics.export.enabled=true

# ==================== AI 普惠教育（edu.*）====================
# ---------------------------------------------------------------------------
# Crisis guard (edu.safety.*)
#
# When a minor expresses self-harm / suicidal ideation, the reply is replaced by
# a fixed script (hotlines 12356 / 12355) and the message is NEVER sent to the LLM.
#
# mode=enforce is the default ON PURPOSE. ai.fc.toolguard.mode defaults to "log"
# because it guards a grey area; this one guards a child. In log mode the reply
# is free-form model output and nothing in the UI or logs reveals the difference
# -- exactly the "silent failure" class this project has been bitten by three
# times already. Use "log" only while tuning the word list.
#
# extra-words lets a school add its own phrasing without a code change:
#   edu.safety.extra-words[0]=<word>
# ---------------------------------------------------------------------------
edu.safety.enabled=true
edu.safety.mode=enforce

# L4 post-generation content check (reuses the ToolGuard judge infrastructure:
# temperature 0, JSON output, circuit breaker + timeout degradation).
#
# mode=log by DEFAULT, and it is a data question rather than a principle question:
# this judge costs one extra LLM call per answer and its accuracy is unmeasured,
# so it observes first. Flip to enforce once the false-positive rate is known.
# Contrast with L1 (exact keywords -> enforce by default) and L2 (fuzzy, but now
# backed by a measured labelled set -> enforce).
#
# Behaviour differs by path, and there is no elegant fix: the non-streaming path
# (WeChat) can REPLACE an unsuitable answer; the streaming path (desktop) has
# already pushed tokens to the user, so it can only APPEND a correction.
edu.safety.content.enabled=true
edu.safety.content.mode=log
edu.safety.content.model=deepseek-v4-flash
edu.safety.content.timeout-ms=3000
edu.safety.content.circuit-fail-threshold=3
edu.safety.content.circuit-open-ms=60000

# ---------------------------------------------------------------------------
# Teacher console role gate (edu.auth.*)
#
# PROTOTYPE-LEVEL ONLY: shared tokens, no teacher identity, no real auth stack.
# Key = token, value = the class it may aggregate. Keep keys ASCII.
#   edu.auth.teacher-classes.<token>=<classId>
# Students never use this -- it only guards /api/edu/teacher/**.
# ---------------------------------------------------------------------------
edu.auth.enabled=true

# Teacher login (primary path). Accounts live in edu_teacher with PBKDF2 hashes;
# POST /api/edu/teacher/login returns an in-memory token with this TTL.
edu.auth.token-ttl-minutes=480

# Legacy shared-token backdoor: a key in teacher-classes can be used directly as
# the X-Edu-Token value. No identity, no expiry -- demo/local only.
# Set false before any real deployment.
edu.auth.legacy-token-enabled=true
edu.auth.teacher-classes.t_demo_1=class_demo_1

# Demo teacher account, auto-created at startup ONLY when edu_teacher is empty.
# Remove the account and set enabled=false before any real deployment.
edu.auth.demo-teacher.enabled=true
edu.auth.demo-teacher.username=${EDU_AUTH_DEMO_TEACHER_USERNAME:${local.secrets.edu.auth.demo-teacher.username:}}
edu.auth.demo-teacher.password=${EDU_AUTH_DEMO_TEACHER_PASSWORD:${local.secrets.edu.auth.demo-teacher.password:}}
edu.auth.demo-teacher.class-id=class_demo_1

# ==================== L2 模糊风险层（router.tfidf.risk.*）====================
# L2 does two jobs with the same TF-IDF model: intent classification (above) and a
# *fuzzy* risk class. They share the centroids but NOT the thresholds:
# an intent mistake only costs tokens, a risk mistake blocks a legitimate question.
# So the risk layer is stricter (0.35 / 0.12 vs 0.25 / 0.10) and has its own mode.
#
# Threshold and mode are BOTH measured, not guessed. Sweep from RiskLayerEvalTest
# (15 labelled positives / 14 negatives, offline):
#   threshold  recall          false-positive
#   0.40        0.0% (0/15)    0.0%
#   0.35       26.7% (4/15)    0.0%
#   0.30       60.0% (9/15)    0.0%
#   0.25       86.7% (13/15)   7.1% (1/14)   <-- knee: lower only buys 1 more hit, FP doubles
#   0.20       93.3% (14/15)   7.1%
#   0.15       93.3%          14.3%
# mode=enforce is therefore justified by data ("observe first, block once measured"),
# not by "fuzzy layers never block". Set mode=log to collect the REAL traffic FP rate
# from the WARN lines + logs/router-eval.jsonl. Notebook figure: labelled-set numbers
# are a regression baseline, NOT the production FP rate.
router.tfidf.risk.enabled=true
router.tfidf.risk.threshold=0.25
router.tfidf.risk.min-margin=0.12
router.tfidf.risk.mode=enforce

# ---------------------------------------------------------------------------
# Prototype demo sample data for the teacher workbench (edu.demo.*)
#
# These rows are PROTOTYPE DEMO SAMPLES used to exercise the workbench UI and the
# aggregation endpoints. They are NOT data from any real school. Replace them with
# real (already anonymised) class data when deploying.
#
# Why a Java seeder instead of a static SQL script: static SQL would hard-code the
# dates, so after a few days nothing falls inside the "last 7 days" window and the
# dashboard goes empty again. The seeder generates dates relative to today.
#
# It writes only to the tables the endpoints actually aggregate from
# (quiz_answer + quiz_question.knowledge_point / edu_topic_ask / edu_crisis_daily /
# edu_user_class), is idempotent (fixed ids + INSERT IGNORE), and contains no
# names, phone numbers or chat text -- warning counts stay aggregate-only.
# Set to false before any real deployment.
# ---------------------------------------------------------------------------
edu.demo.seed-enabled=true

# k-anonymity: aggregates below this value are reported as "insufficient sample"
# (the front end shows a placeholder instead of a number). Prevents a class of one
# from being reverse-identified by a count of 1.
edu.teacher.min-count-to-show=3

# ---------------------------------------------------------------------------
# Knowledge base access control (edu.knowledge.access.*)
#
# Implements "security_level <= user_authorization_level" against two REAL values:
#   security_level        = per-domain level below (1 = public, 2 = needs a student
#                           identity, 3 = reserved for teacher-only libraries)
#   user_authorization_level = derived from the credential, not stored: a uid that
#                           resolves to a class => 2, otherwise anonymous => 1.
#
# Only /search is gated (health/libs carry no content and the knowledge-centre page
# polls them without a student identity). Class-level on/off switches default to
# OPEN: the table only ever holds records for classes that turned a domain OFF.
# ---------------------------------------------------------------------------
edu.knowledge.access.enabled=true
edu.knowledge.access.default-domain-level=1
edu.knowledge.access.domain-levels.lifesafety=2
edu.knowledge.access.domain-levels.sexedu=2
edu.knowledge.access.student-level=2
edu.knowledge.access.anonymous-level=1

# 单人课堂复用成长专题，原班级与教师权限规则保持原样。
edu.knowledge.access.single-user-classroom-enabled=true

# 统一对话模型；环境变量优先，私密回退仅存在于本机忽略文件。
ai.chat.base-url=${AI_CHAT_BASE_URL:https://maas.qianwenaiapi.com/compatible-mode/v1}
ai.chat.api-key=${AI_CHAT_API_KEY:}
ai.chat.model=${AI_CHAT_MODEL:qwen3.8-flash}
ai.chat.enable-thinking=${AI_CHAT_ENABLE_THINKING:false}

# 可选服务统一使用环境变量；本机开发值保存在 local.secrets 命名空间。
weather.key=${WEATHER_KEY:${local.secrets.weather.key:}}
ai.deepseek.key=${AI_DEEPSEEK_KEY:${local.secrets.ai.deepseek.key:}}
dashscope.api.key=${DASHSCOPE_API_KEY:${local.secrets.dashscope.api.key:}}
tencent.asr.secret-id=${TENCENT_ASR_SECRET_ID:${local.secrets.tencent.asr.secret-id:}}
tencent.asr.secret-key=${TENCENT_ASR_SECRET_KEY:${local.secrets.tencent.asr.secret-key:}}
speech.xfyun.app-id=${SPEECH_XFYUN_APP_ID:${local.secrets.speech.xfyun.app-id:}}
speech.xfyun.api-key=${SPEECH_XFYUN_API_KEY:${local.secrets.speech.xfyun.api-key:}}
speech.xfyun.api-secret=${SPEECH_XFYUN_API_SECRET:${local.secrets.speech.xfyun.api-secret:}}
qianfan.search.key=${QIANFAN_SEARCH_KEY:${local.secrets.qianfan.search.key:}}
spring.mail.username=${SPRING_MAIL_USERNAME:${local.secrets.spring.mail.username:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${local.secrets.spring.mail.password:}}
