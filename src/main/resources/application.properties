classroom.code.runner-url=${CODE_RUNNER_URL:http://127.0.0.1:8899}
classroom.code.runner-token=${CODE_RUNNER_TOKEN:}

# 习题规则审核始终执行；模型盲解提供第二意见，不能等同人工确认。
