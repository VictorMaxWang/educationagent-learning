# Ubuntu production profile. Secrets are supplied only by the systemd EnvironmentFile.
spring.application.name=educationagent
server.address=127.0.0.1
server.port=8888
server.forward-headers-strategy=native
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.mvc.async.request-timeout=300000
spring.ai.mcp.client.enabled=false
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/educationagent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia%2FShanghai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:educationagent}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
# 部署脚本从同版 JAR 导入表结构并排除演示 INSERT；避免每次启动重新写演示班级。
spring.sql.init.mode=never
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
mybatis-plus.global-config.db-config.table-underline=true

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}
spring.data.redis.database=0
spring.data.redis.timeout=3000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=4
spring.data.redis.lettuce.pool.min-idle=1

# 邮件 Bean 需要 host 才会装配；未配置账号时不进行邮件发送或启动连接。
spring.mail.host=${SPRING_MAIL_HOST:smtp.qq.com}
spring.mail.port=465
spring.mail.test-connection=false
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# Node is a per-project runtime; no machine-wide PATH or Node installation is required.
classroom.engine.node=${CLASSROOM_ENGINE_NODE:/opt/educationagent/runtime/node/bin/node}
classroom.engine.path=${CLASSROOM_ENGINE_PATH:/opt/educationagent/current/course-engine/dist/worker.js}
classroom.engine.timeout-ms=300000
classroom.data-dir=${CLASSROOM_DATA_DIR:/opt/educationagent/shared/data/classroom}
chat.context.data-dir=/opt/educationagent/shared/data/chat_context
memory.store.index-path=/opt/educationagent/shared/data/memory-index
router.tfidf.store-path=/opt/educationagent/shared/data/intent-tfidf.json
router.eval.log-path=/opt/educationagent/shared/logs/router-eval.jsonl

# Voice and vector credentials are supplied by runtime.env; no secret is packaged in the JAR.
# Vector retrieval is enabled after the separately managed local Chroma service is verified.
memory.chroma.enabled=${MEMORY_CHROMA_ENABLED:false}
memory.chroma.url=http://127.0.0.1:8001
memory.embedding.provider=${MEMORY_EMBEDDING_PROVIDER:ollama}
memory.embedding.ollama.url=http://127.0.0.1:11434
memory.embedding.request-dimensions=${MEMORY_EMBEDDING_REQUEST_DIMENSIONS:false}
memory.integration.enabled=${MEMORY_INTEGRATION_ENABLED:false}

# Production must never create demo teachers, seed demo rows, or accept immortal demo tokens.
edu.auth.enabled=true
edu.auth.legacy-token-enabled=false
edu.auth.demo-teacher.enabled=false
edu.demo.seed-enabled=false
bot.auto-start-count=${BOT_AUTO_START_COUNT:0}

# Optional integrations remain available in code and are activated explicitly when configured.
mcp.lazy.enabled=true
mcp.lazy.preload=
mcp.didi.enabled=false
mcp.didi.base-url=https://mcp.didichuxing.com/mcp-servers
mcp.didi.sandbox=true
mcp.liepin.enabled=false
mcp.mcdonald.enabled=false
mcp.daolv.enabled=false
mcp.daolv-flight.enabled=false
mcp.antv-chart.enabled=false
mcp.wecom-doc.enabled=false
mcp.wecom-todo.enabled=false
mcp.xhs.enabled=false
juhe.mcp.enabled=false
wecom.robot.enabled=false
browser.headless=true
browser.detach=false
file.gen.dir=/opt/educationagent/shared/data/generated
file.convert.libreoffice.path=
file.convert.im.path=
app.ffmpeg.path=ffmpeg

# 公网网关仅开放学习接口与简要健康状态；网站直接使用，不设置登录账号。
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.metrics.tags.application=educationagent
logging.level.root=INFO
logging.level.com.demo=INFO
