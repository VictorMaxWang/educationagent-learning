# MyBatis-Plus
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
mybatis-plus.global-config.db-config.table-underline=true

#
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:${local.secrets.spring.data.redis.password:}}
spring.data.redis.database=0
spring.data.redis.timeout=3000ms

# Lettuce
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=4
spring.data.redis.lettuce.pool.min-idle=1
#
app.cache.redis.ttl.user-settings=1800
app.cache.redis.ttl.chat-history=600

# cache
app.cache.redis.ttl.chat-session=1800
app.cache.redis.ttl.chat-messages=600
app.cache.redis.ttl.chat-memory=1800
app.chat.session.idle-evict-minutes=30

